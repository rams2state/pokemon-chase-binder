<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chase Binder — Pokémon TCG Rarity Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0e1016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chase Binder">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Luckiest+Guy&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0e1016;
    --panel:#171a24;
    --panel2:#1f2330;
    --line:#2b2f3d;
    --text:#eae7dd;
    --dim:#8b8fa3;
    --gold:#FFCB05;
    --gold-bright:#FFE066;
    --foil:#5E7CE2;
    --sir:#ff8fd6;
    --mar:#ff9d5c;
    --mhr:#7c9bff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% -10%, rgba(255,203,5,0.12), transparent 40%),
      radial-gradient(circle at 100% 0%, rgba(59,76,202,0.16), transparent 35%),
      var(--ink);
    color:var(--text);
    font-family:'Manrope', sans-serif;
    min-height:100vh;
  }
  .display{font-family:'Luckiest Guy', 'Bebas Neue', sans-serif; letter-spacing:0.01em;}

  header.hero{
    padding:36px 28px 24px;
    border-bottom:1px solid var(--line);
    position:relative;
    overflow:hidden;
  }
  header.hero::before{
    content:"";
    position:absolute; inset:0;
    background:
      repeating-linear-gradient(115deg, transparent 0 38px, rgba(212,175,55,0.035) 38px 40px);
    pointer-events:none;
  }
  .hero-inner{max-width:1180px; margin:0 auto; position:relative; z-index:1;}
  .eyebrow{
    font-size:12px; letter-spacing:0.22em; text-transform:uppercase;
    color:var(--gold); font-weight:700; margin-bottom:6px;
  }
  h1.display{font-size:44px; margin:0 0 6px; color:var(--text); line-height:0.95;}
  h1.display span{color:var(--gold-bright);}
  .sub{color:var(--dim); font-size:15px; max-width:640px; line-height:1.5;}

  .stats-row{display:flex; gap:22px; margin-top:20px; flex-wrap:wrap;}
  .stat{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:10px 16px; min-width:120px;
  }
  .stat .n{font-family:'Luckiest Guy', 'Bebas Neue'; font-size:26px; color:var(--gold-bright); line-height:1;}
  .stat .l{font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:0.08em; margin-top:3px;}

  .toolbar{
    max-width:1180px; margin:22px auto 0; padding:0 28px;
    display:flex; gap:12px; flex-wrap:wrap; align-items:center;
  }
  .search-wrap{position:relative; flex:1; min-width:220px;}
  input#search{
    width:100%; box-sizing:border-box;
    background:var(--panel); border:1px solid var(--line); color:var(--text);
    padding:11px 36px 11px 14px; border-radius:8px; font-size:14px; font-family:inherit;
  }
  input#search:focus{outline:none; border-color:var(--gold);}
  #clearSearch{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    width:22px; height:22px; border:none; border-radius:50%; cursor:pointer;
    background:transparent; color:var(--dim); font-size:16px; line-height:1;
    display:none; align-items:center; justify-content:center;
  }
  #clearSearch:hover{background:var(--line); color:var(--text);}
  .search-wrap.has-text #clearSearch{display:flex;}
  select#eraFilter, select#rarityFilter{
    background:var(--panel); border:1px solid var(--line); color:var(--text);
    padding:11px 12px; border-radius:8px; font-size:13px; font-family:inherit;
  }
  .toggle-only{
    display:flex; align-items:center; gap:8px; font-size:13px; color:var(--dim);
    background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 14px;
    cursor:pointer; user-select:none;
  }
  .toggle-only input{accent-color:var(--gold);}

  main{max-width:1180px; margin:0 auto; padding:26px 28px 80px;}

  .era-block{margin-bottom:36px;}
  .era-title{
    font-family:'Luckiest Guy', 'Bebas Neue'; font-size:20px; letter-spacing:0.01em; color:var(--foil);
    border-bottom:1px solid var(--line); padding-bottom:8px; margin-bottom:14px;
    display:flex; align-items:baseline; gap:10px;
  }
  .era-title .count{font-family:'Manrope'; font-size:12px; color:var(--dim); font-weight:600;}

  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:14px;}

  .card{
    background:linear-gradient(160deg, var(--panel2), var(--panel));
    border:1px solid var(--line); border-radius:12px; padding:16px;
    cursor:pointer; transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    position:relative; overflow:hidden;
  }
  .card:hover{transform:translateY(-3px); border-color:var(--gold); box-shadow:0 8px 24px rgba(0,0,0,0.35);}
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .set-symbol{width:26px; height:26px; object-fit:contain; opacity:0.9; flex-shrink:0;}
  .set-symbol.missing{visibility:hidden;}
  .set-code{font-size:10px; color:var(--dim); letter-spacing:0.08em; text-transform:uppercase; margin-top:2px;}
  .set-name{font-size:16px; font-weight:700; margin:10px 0 2px; line-height:1.2;}
  .set-meta{font-size:12px; color:var(--dim);}
  .chase-line{
    margin-top:12px; padding-top:10px; border-top:1px dashed var(--line);
    font-size:12px; color:var(--dim); display:flex; gap:8px; flex-wrap:wrap;
  }
  .pill{
    font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:20px;
    letter-spacing:0.03em;
  }
  .pill.ir{background:rgba(212,175,55,0.16); color:var(--gold-bright);}
  .pill.sir{background:rgba(255,143,214,0.16); color:var(--sir);}
  .pill.mar{background:rgba(255,157,92,0.16); color:var(--mar);}
  .pill.mhr{background:rgba(124,155,255,0.18); color:var(--mhr);}
  .pill.pending{background:rgba(139,143,163,0.14); color:var(--dim); font-style:italic; font-weight:600;}

  /* Original-rarity pills (list view) */
  .pill.r-mega-hyper-rare{background:#ff4d6d29; color:#ff4d6d;}
  .pill.r-legend{background:#ffd70029; color:#ffd700;}
  .pill.r-rare-secret{background:#9d7cff29; color:#9d7cff;}
  .pill.r-rare-holo-star{background:#5ce1e629; color:#5ce1e6;}
  .pill.r-hyper-rare{background:#7c9bff29; color:#7c9bff;}
  .pill.r-secret-rare{background:#ff6f6f29; color:#ff6f6f;}
  .pill.r-rare-shining{background:#b98aff29; color:#b98aff;}
  .pill.r-rare-prime{background:#e0779c29; color:#e0779c;}
  .pill.r-rare-shiny-gx{background:#ff7fc229; color:#ff7fc2;}
  .pill.r-rare-holo-vstar{background:#c68cff29; color:#c68cff;}
  .pill.r-rare-holo-lv-x{background:#ffb3e029; color:#ffb3e0;}
  .pill.r-rare-holo-vmax{background:#d88fff29; color:#d88fff;}
  .pill.r-rare-holo-gx{background:#ff9ed429; color:#ff9ed4;}
  .pill.r-rare-break{background:#ff9d5c29; color:#ff9d5c;}
  .pill.r-special-illustration-rare{background:#ff6fb829; color:#ff6fb8;}
  .pill.r-rare-holo-ex{background:#ff8fd629; color:#ff8fd6;}
  .pill.r-uncommon{background:#8fa3ff29; color:#8fa3ff;}
  .pill.r-trainer-gallery-rare-holo{background:#FFCB0529; color:#FFCB05;}
  .pill.r-illustration-rare{background:#FFE06629; color:#FFE066;}
  .pill.r-rare-holo{background:#E8B91429; color:#E8B914;}

  /* Detail view */
  #detail{display:none;}
  #detail.active{display:block;}
  #listView.hidden{display:none;}
  .toolbar.hidden{display:none;}
  .back-btn{
    background:none; border:1px solid var(--line); color:var(--text); padding:12px 22px;
    border-radius:9px; cursor:pointer; font-family:inherit; font-size:16px; font-weight:600; margin-bottom:20px;
    display:inline-flex; align-items:center; gap:8px;
  }
  .back-btn:hover{border-color:var(--gold); color:var(--gold-bright);}
  .detail-head{display:flex; align-items:center; gap:16px; margin-bottom:6px;}
  .detail-head img{width:44px; height:44px; object-fit:contain;}
  .detail-head h2{font-family:'Luckiest Guy', 'Bebas Neue'; font-size:32px; margin:0; letter-spacing:0.01em;}
  .detail-meta{color:var(--dim); font-size:13px; margin-bottom:24px;}
  .jp-badges{display:flex; align-items:center; gap:6px; margin-left:2px;}
  .jp-badges img{width:30px; height:30px; object-fit:contain; opacity:0.92;}
  .jp-badges .jp-plus{color:var(--dim); font-size:13px;}
  .set-symbol-wrap{display:flex; align-items:center; gap:6px;}
  .jp-symbol-mini{width:16px; height:16px; object-fit:contain; opacity:0.9; vertical-align:middle;}

  .legend{display:flex; gap:16px; flex-wrap:wrap; margin-bottom:22px; font-size:12.5px; color:var(--dim);}
  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .dot{width:10px; height:10px; border-radius:50%; display:inline-block;}
  .dot.ir{background:var(--gold-bright);}
  .dot.sir{background:var(--sir);}
  .dot.mar{background:var(--mar);}
  .dot.mhr{background:var(--mhr);}

  .tier{margin-bottom:26px;}
  .tier-title{
    font-family:'Luckiest Guy', 'Bebas Neue'; font-size:16px; letter-spacing:0.01em; margin-bottom:10px;
  }
  .tier-title.ir{color:var(--gold-bright);}
  .tier-title.sir{color:var(--sir);}
  .tier-title.mar{color:var(--mar);}
  .tier-title.mhr{color:var(--mhr);}
  /* Original-rarity tier headers (detail view) */
  .tier-title.r-mega-hyper-rare{color:#ff4d6d;}
  .tier-title.r-legend{color:#ffd700;}
  .tier-title.r-rare-secret{color:#9d7cff;}
  .tier-title.r-rare-holo-star{color:#5ce1e6;}
  .tier-title.r-hyper-rare{color:#7c9bff;}
  .tier-title.r-secret-rare{color:#ff6f6f;}
  .tier-title.r-rare-shining{color:#b98aff;}
  .tier-title.r-rare-prime{color:#e0779c;}
  .tier-title.r-rare-shiny-gx{color:#ff7fc2;}
  .tier-title.r-rare-holo-vstar{color:#c68cff;}
  .tier-title.r-rare-holo-lv-x{color:#ffb3e0;}
  .tier-title.r-rare-holo-vmax{color:#d88fff;}
  .tier-title.r-rare-holo-gx{color:#ff9ed4;}
  .tier-title.r-rare-break{color:#ff9d5c;}
  .tier-title.r-special-illustration-rare{color:#ff6fb8;}
  .tier-title.r-rare-holo-ex{color:#ff8fd6;}
  .tier-title.r-uncommon{color:#8fa3ff;}
  .tier-title.r-trainer-gallery-rare-holo{color:#FFCB05;}
  .tier-title.r-illustration-rare{color:#FFE066;}
  .tier-title.r-rare-holo{color:#E8B914;}

  .cardlist{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:8px;}
  .cardrow{
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:10px 12px; display:flex; align-items:center; gap:10px; cursor:pointer;
    transition:border-color .15s;
  }
  .cardrow:hover{border-color:var(--gold);}
  .cardrow input[type=checkbox]{accent-color:var(--gold); width:16px; height:16px; flex-shrink:0;}
  .cardrow .num{color:var(--dim); font-size:12px; min-width:30px;}
  .cardrow .cname{font-size:13.5px; font-weight:600; flex:1;}
  .cardrow .price{font-size:11.5px; color:var(--dim); font-weight:700;}
  .cardrow.checked .cname{color:var(--dim); text-decoration:line-through;}

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--dim);
    border:1px dashed var(--line); border-radius:12px;
  }
  .empty-state .display{font-size:22px; color:var(--text); margin-bottom:8px;}

  footer{
    text-align:center; color:var(--dim); font-size:12px; padding:20px; border-top:1px solid var(--line);
  }

  .card-modal-backdrop{
    display:none; position:fixed; inset:0; background:rgba(8,9,14,0.82);
    z-index:80; align-items:center; justify-content:center; padding:24px;
  }
  .card-modal-backdrop.active{display:flex;}
  .card-modal{
    background:linear-gradient(160deg, var(--panel2), var(--panel));
    border:1px solid var(--line); border-radius:16px; padding:24px;
    max-width:380px; width:100%; text-align:center; position:relative;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
  }
  .card-modal .cm-close{
    position:absolute; top:10px; right:10px; background:none; border:none;
    color:var(--dim); font-size:24px; cursor:pointer; line-height:1; padding:4px 10px;
  }
  .card-modal .cm-close:hover{color:var(--gold-bright);}
  .card-modal .cm-imgwrap{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:10px; margin-bottom:16px; min-height:200px; display:flex; align-items:center; justify-content:center;
  }
  .card-modal img{max-width:100%; max-height:56vh; border-radius:8px; display:block;}
  .card-modal .cm-fallback{color:var(--dim); font-size:13px; padding:70px 10px;}
  .card-modal .cm-name{font-family:'Luckiest Guy', 'Bebas Neue'; font-size:23px; letter-spacing:0.01em;}
  .card-modal .cm-meta{color:var(--dim); font-size:13px; margin-top:6px;}
  .card-modal .cm-price{font-size:18px; font-weight:800; color:var(--gold-bright); margin-top:12px;}
  .card-modal .cm-find-btn{
    display:block; margin-top:18px; padding:13px 18px; border-radius:9px;
    background:var(--gold); color:#231a00; font-weight:800; text-decoration:none;
    font-size:14px; letter-spacing:0.02em; text-align:center;
    transition:background .15s ease, transform .15s ease;
  }
  .card-modal .cm-find-btn:hover{background:var(--gold-bright); transform:translateY(-1px);}
</style>
</head>
<body>

<div class="toolbar">
  <div class="search-wrap" id="searchWrap">
    <input id="search" type="text" placeholder="Search sets (e.g. Chaos Rising, Base Set, XY)…">
    <button id="clearSearch" type="button" aria-label="Clear search">&times;</button>
  </div>
</div>

<main>
  <div id="listView"></div>

  <div id="detail">
    <button class="back-btn" onclick="history.back()">&larr; Back to all sets</button>
    <div class="detail-head">
      <img id="dSymbol" src="" alt="">
      <div class="jp-badges" id="dJpBadges"></div>
      <div>
        <h2 class="display" id="dName"></h2>
      </div>
    </div>
    <div class="detail-meta" id="dMeta"></div>
    <div id="tiers"></div>
  </div>
</main>

<div class="card-modal-backdrop" id="cardModalBackdrop">
  <div class="card-modal">
    <button class="cm-close" onclick="closeCardModal()" aria-label="Close">&times;</button>
    <div class="cm-imgwrap">
      <img id="cmImg" src="" alt="" onerror="this.style.display='none'; document.getElementById('cmFallback').style.display='block';">
      <div class="cm-fallback" id="cmFallback" style="display:none;">Image unavailable</div>
    </div>
    <div class="cm-name" id="cmName"></div>
    <div class="cm-meta" id="cmMeta"></div>
    <div class="cm-price" id="cmPrice"></div>
    <a class="cm-find-btn" id="cmFindBtn" href="#" target="_blank" rel="noopener noreferrer">Find Card on TCGplayer &rarr;</a>
  </div>
</div>

let owned = {};
try{ owned = JSON.parse(localStorage.getItem('chaseBinderOwned') || '{}'); }catch(e){ owned = {}; }

function saveOwned(){
  localStorage.setItem('chaseBinderOwned', JSON.stringify(owned));
  updateOwnedStat();
}
function updateOwnedStat(){
  // stats display removed; owned counts still persist via localStorage in saveOwned()
}

// build era order (by earliest year desc, matching data order roughly)
const eraOrder = [];
SETS.forEach(s => { if(!eraOrder.includes(s.era)) eraOrder.push(s.era); });

function init(){
  updateOwnedStat();
  const searchEl = document.getElementById('search');
  const searchWrap = document.getElementById('searchWrap');
  const clearBtn = document.getElementById('clearSearch');
  searchEl.addEventListener('input', () => {
    searchWrap.classList.toggle('has-text', searchEl.value.length > 0);
    renderList();
  });
  clearBtn.addEventListener('click', () => {
    searchEl.value = '';
    searchWrap.classList.remove('has-text');
    searchEl.focus();
    renderList();
  });
  renderList();
}

const ORIG_RARITY_ORDER = [
  'Mega Hyper Rare','LEGEND','Rare Secret','Rare Holo Star','Hyper Rare',
  'Secret Rare','Rare Shining','Rare Prime','Rare Shiny GX','Rare Holo VSTAR',
  'Rare Holo LV.X','Rare Holo VMAX','Rare Holo GX','Rare BREAK','Special Illustration Rare',
  'Rare Holo EX','Uncommon','Trainer Gallery Rare Holo','Illustration Rare','Rare Holo'
];
function origSlug(s){
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
}

// Trainer Gallery / Galarian Gallery / Shiny Vault subsets are merged into their
// parent set id in CHASE, but real card images live under the subset's own set id.
const IMG_SUBSET_MAP = { swsh9:'swsh9tg', swsh10:'swsh10tg', swsh11:'swsh11tg', swsh12:'swsh12tg', swsh12pt5:'swsh12pt5gg' };
const IMG_SCRYDEX_SETS = new Set(['me4','me3','me2pt5']);

function displayNum(num){
  return String(num).split('/')[0];
}
function cardImageUrl(setId, num, hires){
  num = displayNum(num);
  let realSet = setId;
  if(IMG_SUBSET_MAP[setId] && /^(GG|TG)/i.test(num)){
    realSet = IMG_SUBSET_MAP[setId];
  } else if(setId === 'sm115' && /^SV/i.test(num)){
    realSet = 'sma';
  } else if(setId === 'swsh45sv' && !/^SV/i.test(num)){
    realSet = 'swsh45';
  }
  if(IMG_SCRYDEX_SETS.has(realSet)){
    return `https://images.scrydex.com/pokemon/${realSet}-${num}/${hires ? 'large' : 'small'}`;
  }
  return `https://images.pokemontcg.io/${realSet}/${num}${hires ? '_hires' : ''}.png`;
}

function searchRarityTerm(orig){
  if(!orig || orig === 'Rare Holo' || orig === 'Uncommon') return '';
  if(orig === 'Trainer Gallery Rare Holo') return 'Trainer Gallery';
  if(orig.startsWith('Rare Holo ')) return orig.slice('Rare Holo '.length);
  if(orig.startsWith('Rare ')) return orig.slice('Rare '.length);
  return orig;
}
function openCardModal(setId, c){
  const img = document.getElementById('cmImg');
  const fallback = document.getElementById('cmFallback');
  img.style.display = '';
  fallback.style.display = 'none';
  img.src = cardImageUrl(setId, c.num, true);
  document.getElementById('cmName').textContent = c.name;
  document.getElementById('cmMeta').textContent = `#${displayNum(c.num)} · ${c.orig}`;
  document.getElementById('cmPrice').textContent = c.price || '';
  const setForLink = SETS.find(x => x.id === setId);
  const searchQuery = encodeURIComponent(`${c.name} ${setForLink ? setForLink.name : ''} ${searchRarityTerm(c.orig)}`.replace(/\s+/g, ' ').trim());
  document.getElementById('cmFindBtn').href = `https://www.tcgplayer.com/search/pokemon/product?productLineName=pokemon&q=${searchQuery}&view=grid`;
  document.getElementById('cardModalBackdrop').classList.add('active');
}
function closeCardModal(){
  document.getElementById('cardModalBackdrop').classList.remove('active');
}
document.getElementById('cardModalBackdrop').addEventListener('click', (e) => {
  if(e.target.id === 'cardModalBackdrop') closeCardModal();
});
document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeCardModal(); });
function chaseSummary(setId){
  const cards = CHASE[setId];
  if(!cards) return null;
  const counts = {};
  cards.forEach(c => { counts[c.orig] = (counts[c.orig]||0) + 1; });
  return counts;
}

function renderList(){
  const q = document.getElementById('search').value.trim().toLowerCase();

  const container = document.getElementById('listView');
  container.innerHTML = '';

  let any = false;

  eraOrder.forEach(era => {
    let setsInEra = SETS.filter(s => s.era === era);
    if(q) setsInEra = setsInEra.filter(s => s.name.toLowerCase().startsWith(q) || (s.code||'').toLowerCase().startsWith(q));
    if(setsInEra.length === 0) return;
    any = true;

    const block = document.createElement('div');
    block.className = 'era-block';
    block.innerHTML = `<div class="era-title">${era} <span class="count">${setsInEra.length} set${setsInEra.length>1?'s':''}</span></div>`;
    const grid = document.createElement('div');
    grid.className = 'grid';

    setsInEra.forEach(s => {
      const summary = chaseSummary(s.id);
      const card = document.createElement('div');
      card.className = 'card' + (s.status==='done' ? ' done' : '');
      card.onclick = () => showDetail(s.id);

      let chaseLine = '<span class="pill pending">Not yet catalogued</span>';
      if(summary){
        const parts = [];
        const seen = new Set();
        ORIG_RARITY_ORDER.forEach(orig => {
          if(summary[orig]){ parts.push(`<span class="pill r-${origSlug(orig)}">${summary[orig]} ${orig}</span>`); seen.add(orig); }
        });
        Object.keys(summary).forEach(orig => {
          if(!seen.has(orig)) parts.push(`<span class="pill r-${origSlug(orig)}">${summary[orig]} ${orig}</span>`);
        });
        chaseLine = parts.join('') || '<span class="pill pending">Not yet catalogued</span>';
      }

      const jpMini = (s.jp && s.jp.length) ? `<img class="jp-symbol-mini" src="${s.jp[0].symbol}" alt="JP: ${s.jp[0].name}" title="JP: ${s.jp.map(j=>j.name).join(' + ')}" onerror="this.style.display='none'">` : '';
      card.innerHTML = `
        <div class="card-top">
          <div class="set-symbol-wrap">
            <img class="set-symbol ${s.symbol?'':'missing'}" src="${s.symbol||''}" onerror="this.style.visibility='hidden'">
            ${jpMini}
          </div>
          <div class="set-meta">${s.year}</div>
        </div>
        <div class="set-code">${s.code || ''}</div>
        <div class="set-name">${s.name}</div>
        <div class="set-meta">${s.total} cards</div>
        <div class="chase-line">${chaseLine}</div>
      `;
      grid.appendChild(card);
    });

    block.appendChild(grid);
    container.appendChild(block);
  });

  if(!any){
    container.innerHTML = '<div class="empty-state"><div class="display">No sets match</div>Try a different search or filter.</div>';
  }
}

function renderDetail(setId){
  const s = SETS.find(x=>x.id===setId);
  if(!s) return;
  document.getElementById('listView').classList.add('hidden');
  document.querySelector('.toolbar').classList.add('hidden');
  document.getElementById('detail').classList.add('active');
  document.getElementById('dSymbol').src = s.symbol || '';
  document.getElementById('dName').textContent = s.name;
  document.getElementById('dMeta').textContent = `${s.era} · ${s.year} · ${s.code || ''} · ${s.total} cards total`;

  const jpBadges = document.getElementById('dJpBadges');
  jpBadges.innerHTML = '';
  if(s.jp && s.jp.length){
    const plus = document.createElement('span');
    plus.className = 'jp-plus';
    plus.textContent = 'JP:';
    jpBadges.appendChild(plus);
    s.jp.forEach(j => {
      const img = document.createElement('img');
      img.src = j.symbol;
      img.alt = j.name;
      img.title = j.name;
      img.onerror = () => { img.style.display = 'none'; };
      jpBadges.appendChild(img);
    });
  }

  const tiersDiv = document.getElementById('tiers');
  tiersDiv.innerHTML = '';
  const cards = CHASE[setId];

  if(!cards){
    tiersDiv.innerHTML = `<div class="empty-state"><div class="display">Chase list coming soon</div>This set hasn't been catalogued yet — check back as more sets get added.</div>`;
    return;
  }

  if(!owned[setId]) owned[setId] = {};

  const origsPresent = [...new Set(cards.map(c => c.orig))];
  const origsOrdered = ORIG_RARITY_ORDER.filter(o => origsPresent.includes(o))
    .concat(origsPresent.filter(o => !ORIG_RARITY_ORDER.includes(o)));

  origsOrdered.forEach(orig => {
    const inTier = cards.filter(c => c.orig === orig);
    if(inTier.length === 0) return;
    const tierDiv = document.createElement('div');
    tierDiv.className = 'tier';
    tierDiv.innerHTML = `<div class="tier-title r-${origSlug(orig)}">${orig} (${inTier.length})</div>`;
    const list = document.createElement('div');
    list.className = 'cardlist';

    inTier.forEach(c => {
      const key = c.num + '-' + c.name;
      const isChecked = !!owned[setId][key];
      const row = document.createElement('div');
      row.className = 'cardrow' + (isChecked ? ' checked' : '');
      const priceHtml = c.price ? `<span class="price">${c.price}</span>` : '';
      row.innerHTML = `<input type="checkbox" ${isChecked?'checked':''}> <span class="num">#${displayNum(c.num)}</span> <span class="cname">${c.name}</span> ${priceHtml}`;
      const checkboxEl = row.querySelector('input');
      checkboxEl.addEventListener('click', (e) => e.stopPropagation());
      checkboxEl.addEventListener('change', (e) => {
        owned[setId][key] = e.target.checked;
        row.classList.toggle('checked', e.target.checked);
        saveOwned();
      });
      row.addEventListener('click', () => openCardModal(setId, c));
      list.appendChild(row);
    });

    tierDiv.appendChild(list);
    tiersDiv.appendChild(tierDiv);
  });
}

function showDetail(setId){
  renderDetail(setId);
  const cur = history.state;
  if(!cur || cur.view !== 'detail' || cur.setId !== setId){
    history.pushState({view:'detail', setId}, '', '#' + setId);
  }
}

window.addEventListener('popstate', (e) => {
  if(e.state && e.state.view === 'detail'){
    renderDetail(e.state.setId);
  } else {
    showList();
  }
});

// iPhone-style edge swipe: start the touch near the left edge and drag right to go back
(function(){
  const detailEl = document.getElementById('detail');
  let startX = null, startY = null, tracking = false;
  detailEl.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    tracking = t.clientX < 30;
    startX = t.clientX; startY = t.clientY;
  }, {passive:true});
  detailEl.addEventListener('touchend', (e) => {
    if(!tracking) return;
    tracking = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - startX;
    const dy = Math.abs(t.clientY - startY);
    if(dx > 70 && dy < 60) history.back();
  }, {passive:true});
})();

function showList(){
  document.getElementById('detail').classList.remove('active');
  document.getElementById('listView').classList.remove('hidden');
  document.querySelector('.toolbar').classList.remove('hidden');
}

history.replaceState({view:'list'}, '');
init();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
